name: Build Signed Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www/vendor
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp icon-192x192.png www/
          cp icon-512x512.png www/
          cp jszip.min.js www/vendor/jszip.min.js
          cp sqlite-bridge.js www/

      - name: Add Android
        run: npx cap add android

      - name: Add custom AndroidPublicFile plugin
        run: |
          PKG_DIR="android/app/src/main/java/com/saidbadji/meterreading"
          mkdir -p "$PKG_DIR"
          cp android-plugin/AndroidPublicFilePlugin.java "$PKG_DIR/AndroidPublicFilePlugin.java"
          echo "" | base64 -d > "$PKG_DIR/MainActivity.java"

      - name: Enable legacy external storage (write straight to internal storage)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Cap targetSdkVersion at 29 -- requestLegacyExternalStorage is
          #    only honoured up to Android 10 (API 29).
          vars_path = Path("android/variables.gradle")
          s = vars_path.read_text()
          s = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 29", s)
          vars_path.write_text(s)

          # 2) Tell Android this app wants the old (pre-scoped-storage)
          #    external storage behaviour.
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest_path.read_text()
          if "requestLegacyExternalStorage" not in m:
              m = m.replace(
                  "<application",
                  '<application\n        android:requestLegacyExternalStorage="true"',
                  1
              )
          manifest_path.write_text(m)
          PY

      - name: Generate Android assets
        run: npx @capacitor/assets generate --android

      - name: Copy web files
        run: npx cap copy android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Add camera, location and storage permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = """
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
          """

          if "android.permission.CAMERA" not in s:
              s = s.replace(
                  "<application",
                  permissions + "\n    <application",
                  1
              )

          p.write_text(s)
          PY

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          cd android
          chmod +x gradlew

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release-key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEYSTORE_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Find signed APK
        run: |
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ADE-Meter-Reading-Signed-Release
          path: android/app/build/outputs/apk/release/*.apk
